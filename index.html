<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>Grand Staff Sprint</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Noto+Music&display=swap">
<style>
/* Layout: one centered practice column — settings strip, timer bar, staff card, answer pad. */
:root {
  --paper: #f3f5f9; --card: #ffffff; --ink: #161d2b; --muted: #5a6477; --line: #cdd3de;
  --felt: #8e1f30; --felt-soft: #f4e3e6; --good: #2b7a4b; --bad: #c73a26; --key: #ffffff; --key-edge: #b9c0cd;
  --display: "Gloock", Georgia, serif;
  --body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  --music: "Noto Music", "Bravura Text", "Segoe UI Symbol", serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #0f131b; --card: #171d28; --ink: #e7eaf0; --muted: #9aa3b4; --line: #343c4b;
  --felt: #e3707f; --felt-soft: #3a1f26; --good: #5cc28a; --bad: #f2806a; --key: #1f2633; --key-edge: #3d4657; color-scheme: dark; } }
:root[data-theme="dark"] {
  --paper: #0f131b; --card: #171d28; --ink: #e7eaf0; --muted: #9aa3b4; --line: #343c4b;
  --felt: #e3707f; --felt-soft: #3a1f26; --good: #5cc28a; --bad: #f2806a; --key: #1f2633; --key-edge: #3d4657; color-scheme: dark; }

html, body { min-height: 100%; }
body { background: var(--paper); color: var(--ink); font: 15px/1.5 var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 40px; }
.wrap { max-width: 640px; margin: 0 auto; display: grid; gap: 16px; }
header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 { font: 400 clamp(26px, 6vw, 34px)/1.1 var(--display); margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
h1 span { color: var(--felt); }
.best { font: 500 12px var(--mono); color: var(--muted); }

.settings { display: grid; gap: 10px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.label { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); min-width: 64px; }
.chip { position: relative; }
.chip input { position: absolute; opacity: 0; pointer-events: none; }
.chip span { display: inline-block; padding: 6px 12px; border: 1px solid var(--line); border-radius: 999px; font-size: 13px; font-weight: 500; cursor: pointer; user-select: none; background: var(--card); }
.chip input:checked + span { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.chip input:focus-visible + span { outline: 2px solid var(--felt); outline-offset: 2px; }
.chip input:disabled + span { opacity: .4; cursor: default; }

.hud { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.stat { display: grid; gap: 0; }
.stat b { font: 700 22px var(--mono); font-variant-numeric: tabular-nums; }
.stat small { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.bar { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 100%; background: var(--felt); transform-origin: left; }
.cardbar { height: 3px; background: transparent; }
.cardbar i { display: block; height: 100%; background: var(--muted); transform-origin: left; opacity: .5; }

.stage { position: relative; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 8px 8px 4px; }
.stage svg { display: block; width: 100%; height: auto; }
.prompt { text-align: center; font-size: 13px; color: var(--muted); min-height: 22px; padding-bottom: 6px; font-weight: 500; }
.prompt.good { color: var(--good); } .prompt.bad { color: var(--bad); }
.overlay { position: absolute; inset: 0; display: grid; place-items: center; background: color-mix(in srgb, var(--card) 72%, transparent); border-radius: 14px; }
[hidden] { display: none !important; }
.start { font: 600 16px var(--body); background: var(--felt); color: #fff; border: 0; border-radius: 999px; padding: 12px 28px; cursor: pointer; }
:root[data-theme="dark"] .start { color: #1a0d10; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .start { color: #1a0d10; } }
.start:focus-visible, button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

.pad { display: grid; gap: 10px; }
.keys { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.keys button { font: 600 20px var(--display); height: 64px; border-radius: 0 0 10px 10px; border: 1px solid var(--key-edge); border-top: 3px solid var(--ink); background: var(--key); color: var(--ink); cursor: pointer; }
.keys button:active { transform: translateY(1px); }
.keys button.on { background: var(--ink); color: var(--paper); }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 6px; }
.seg button { font: 600 14px var(--body); padding: 10px 6px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); color: var(--ink); cursor: pointer; }
.seg button.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.go { font: 600 15px var(--body); padding: 12px; border: 0; border-radius: 10px; background: var(--felt); color: #fff; cursor: pointer; }
.go:disabled { opacity: .35; cursor: default; }
.hint { font-size: 12px; color: var(--muted); text-align: center; }

.results { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: grid; gap: 12px; }
.results h2 { font: 400 24px var(--display); margin: 0; }
.results .big { display: flex; gap: 24px; flex-wrap: wrap; }
.results .big div b { font: 700 28px var(--mono); display: block; font-variant-numeric: tabular-nums; }
.results .big div small { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
.missed { display: flex; flex-wrap: wrap; gap: 6px; }
.missed span { font: 500 12px var(--mono); padding: 3px 8px; border-radius: 6px; background: var(--felt-soft); color: var(--felt); }
.toggle { background: none; border: 0; color: var(--muted); font: 500 12px var(--body); cursor: pointer; text-decoration: underline; padding: 0; }
.history { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: grid; gap: 14px; min-width: 0; }
.hhead { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.history h2 { font: 400 24px var(--display); margin: 0; }
.mini { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 2px; gap: 2px; }
.mini button { font: 600 12px var(--body); border: 0; background: none; color: var(--muted); padding: 5px 10px; border-radius: 999px; cursor: pointer; }
.mini button.on { background: var(--ink); color: var(--paper); }
.hsum { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.hsum div b { font: 700 20px var(--mono); display: block; font-variant-numeric: tabular-nums; }
.hsum div small { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
.chart { position: relative; min-width: 0; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .axis { fill: var(--muted); font: 500 10.5px var(--mono); }
.chart .ln { fill: none; stroke: var(--felt); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.chart .ar { fill: var(--felt); opacity: .10; }
.chart .dot { fill: var(--felt); stroke: var(--card); stroke-width: 2; }
.chart .end { fill: var(--ink); font: 700 12px var(--mono); }
.chart .xh { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 3 3; }
.chart .hit { fill: transparent; cursor: crosshair; }
.tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--paper); font: 500 12px/1.4 var(--body); padding: 7px 10px; border-radius: 8px; white-space: nowrap; transform: translate(-50%, calc(-100% - 12px)); }
.tip b { font-family: var(--mono); }
.empty { border: 1px dashed var(--line); border-radius: 10px; padding: 22px 14px; text-align: center; color: var(--muted); font-size: 13px; }
.tablewrap { overflow-x: auto; min-width: 0; }
.htable { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
.htable th { text-align: left; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; padding: 0 10px 6px 0; border-bottom: 1px solid var(--line); }
.htable td { padding: 7px 10px 7px 0; border-bottom: 1px solid var(--line); white-space: nowrap; }
.htable td.num, .htable th.num { text-align: right; font-family: var(--mono); }
.htable tr:last-child td { border-bottom: 0; }
.missed small { opacity: .75; }
.clearrow { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 13px; }
.clearrow .danger { font: 600 12px var(--body); border: 0; border-radius: 8px; background: var(--bad); color: #fff; padding: 6px 12px; cursor: pointer; }
.clearrow .plain { font: 600 12px var(--body); border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--ink); padding: 5px 12px; cursor: pointer; }
@media (max-width: 420px) { .keys button { height: 56px; font-size: 18px; } .stat b { font-size: 18px; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<div class="wrap">
  <header>
    <h1>Grand Staff <span>Sprint</span></h1>
    <div class="best" id="best">Best: —</div>
  </header>

  <div class="settings" id="settings">
    <div class="row"><span class="label">Clefs</span>
      <label class="chip"><input type="checkbox" id="optTreble" checked><span>𝄞 Treble</span></label>
      <label class="chip"><input type="checkbox" id="optBass" checked><span>𝄢 Bass</span></label>
    </div>
    <div class="row"><span class="label">Cards</span>
      <label class="chip"><input type="checkbox" id="optNotes" checked><span>Single notes</span></label>
      <label class="chip"><input type="checkbox" id="optChords"><span>Chords</span></label>
      <label class="chip"><input type="checkbox" id="optInv"><span>Inversions</span></label>
    </div>
    <div class="row"><span class="label">Session</span>
      <label class="chip"><input type="radio" name="dur" id="dur30" value="30"><span>30 s</span></label>
      <label class="chip"><input type="radio" name="dur" id="dur60" value="60" checked><span>60 s</span></label>
      <label class="chip"><input type="radio" name="dur" id="dur120" value="120"><span>2 min</span></label>
      <label class="chip"><input type="radio" name="dur" id="dur300" value="300"><span>5 min</span></label>
    </div>
    <div class="row"><span class="label">Per card</span>
      <label class="chip"><input type="radio" name="lim" id="lim0" value="0" checked><span>No limit</span></label>
      <label class="chip"><input type="radio" name="lim" id="lim3" value="3"><span>3 s</span></label>
      <label class="chip"><input type="radio" name="lim" id="lim5" value="5"><span>5 s</span></label>
      <label class="chip"><input type="radio" name="lim" id="lim10" value="10"><span>10 s</span></label>
      <label class="chip"><input type="checkbox" id="optSound" checked><span>Sound</span></label>
    </div>
  </div>

  <div class="hud">
    <div class="stat"><b id="hTime">1:00</b><small>Time left</small></div>
    <div class="stat"><b id="hScore">0</b><small>Correct</small></div>
    <div class="stat"><b id="hAcc">—</b><small>Accuracy</small></div>
    <div class="stat"><b id="hStreak">0</b><small>Streak</small></div>
  </div>
  <div class="bar"><i id="timeBar"></i></div>

  <div class="stage">
    <div id="staff"></div>
    <div class="cardbar"><i id="cardBar" style="transform:scaleX(0)"></i></div>
    <div class="prompt" id="prompt">Name the note</div>
    <div class="overlay" id="overlay"><button class="start" id="startBtn">Start</button></div>
  </div>

  <div class="results" id="results" hidden></div>

  <div class="pad" id="pad">
    <div class="keys" id="keys"></div>
    <div class="seg" id="qualRow" hidden>
      <button data-q="maj">Major</button><button data-q="min">Minor</button>
    </div>
    <div class="seg" id="invRow" hidden>
      <button data-i="0">Root pos.</button><button data-i="1">1st inv.</button><button data-i="2">2nd inv.</button>
    </div>
    <button class="go" id="goBtn" hidden disabled>Submit chord</button>
    <div class="hint" id="hint">Tap a letter or press A–G on your keyboard</div>
  </div>

  <section class="history" id="history">
    <div class="hhead">
      <h2>History</h2>
      <div class="mini" id="scopeSeg"><button data-v="cfg" class="on">These settings</button><button data-v="all">All sessions</button></div>
    </div>
    <div class="hsum" id="hSum"></div>
    <div class="hhead">
      <div class="label">Last 30 sessions</div>
      <div class="mini" id="metricSeg"><button data-v="right" class="on">Correct</button><button data-v="acc">Accuracy</button><button data-v="avg">Sec / card</button></div>
    </div>
    <div class="chart" id="chart"></div>
    <div>
      <div class="label" style="margin-bottom:8px">Most missed</div>
      <div class="missed" id="hMissed"></div>
    </div>
    <div>
      <div class="label" style="margin-bottom:6px">Recent sessions</div>
      <div class="tablewrap"><table class="htable" id="hTable"></table></div>
    </div>
    <div class="clearrow">
      <button class="toggle" id="clearBtn">Clear history</button>
      <span id="clearAsk" hidden>Delete every saved session and best score on this device?
        <button class="danger" id="clearYes">Delete</button> <button class="plain" id="clearNo">Cancel</button></span>
    </div>
  </section>
</div>

<script>
(() => {
  const LET = "CDEFGAB";
  const NAT = [0, 2, 4, 5, 7, 9, 11];
  // Diatonic step = letterIndex + 7 * octave. Treble bottom line E4, bass bottom line G2.
  const CLEF = {
    treble: { bottom: 30, lo: 26, hi: 42 },   // A3 … C6  (17 notes)
    bass:   { bottom: 18, lo: 14, hi: 29 },   // C2 … D4  (16 notes)
  };
  const $ = id => document.getElementById(id);
  const store = {
    get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
  };

  const nameOf = (step, acc = 0) => LET[step % 7] + (acc > 0 ? "♯" : acc < 0 ? "♭" : "") + Math.floor(step / 7);
  const midiOf = (step, acc = 0) => 12 * (Math.floor(step / 7) + 1) + NAT[step % 7] + acc;

  // ---------- deck ----------
  function opts() {
    return {
      treble: $("optTreble").checked, bass: $("optBass").checked,
      notes: $("optNotes").checked, chords: $("optChords").checked, inv: $("optInv").checked,
      dur: +document.querySelector("input[name=dur]:checked").value,
      lim: +document.querySelector("input[name=lim]:checked").value,
      sound: $("optSound").checked,
    };
  }
  function buildChord(clef, rootIdx, qual, inv) {
    const c = CLEF[clef];
    let r = rootIdx + 7 * (clef === "treble" ? 4 : 3);
    const ivals = [0, qual === "maj" ? 4 : 3, 7];
    const tones = [0, 2, 4].map((d, i) => ({ d, semi: (NAT[rootIdx] + ivals[i]) % 12 }));
    const order = inv === 0 ? [[0, 0], [1, 0], [2, 0]] : inv === 1 ? [[1, 0], [2, 0], [0, 7]] : [[2, 0], [0, 7], [1, 7]];
    let steps = order.map(([t, up]) => tones[t].d + up);
    const place = off => steps.map(s => r + s + off);
    let off = 0;
    while (Math.max(...place(off)) > c.bottom + 12) off -= 7;
    while (Math.min(...place(off)) < c.bottom - 4) off += 7;
    return order.map(([t], i) => {
      const step = place(off)[i];
      let acc = (tones[t].semi - NAT[step % 7] + 12) % 12; if (acc > 6) acc -= 12;
      return { step, acc };
    });
  }
  function buildDeck(o) {
    const clefs = [o.treble && "treble", o.bass && "bass"].filter(Boolean);
    const deck = [];
    for (const clef of clefs) {
      if (o.notes) for (let s = CLEF[clef].lo; s <= CLEF[clef].hi; s++)
        deck.push({ kind: "note", clef, tones: [{ step: s, acc: 0 }], letter: LET[s % 7], label: nameOf(s) });
      if (o.chords || o.inv) {
        const invs = o.inv ? (o.chords ? [0, 1, 2] : [1, 2]) : [0];
        for (let ri = 0; ri < 7; ri++) for (const q of ["maj", "min"]) for (const inv of invs)
          deck.push({ kind: "chord", clef, root: LET[ri], qual: q, inv, tones: buildChord(clef, ri, q, inv),
            label: `${LET[ri]} ${q === "maj" ? "major" : "minor"}${inv ? `, ${inv === 1 ? "1st" : "2nd"} inv.` : ""}` });
      }
    }
    return deck;
  }

  // ---------- staff drawing ----------
  const W = 360, H = 176, SP = 12, HS = 6, TOP = 52, BOT = TOP + 4 * SP, NX = 210;
  function staffSVG(card, state) {
    const c = CLEF[card.clef];
    const y = s => BOT - (s - c.bottom) * HS;
    let g = "";
    for (let i = 0; i < 5; i++) g += `<line x1="8" x2="${W - 8}" y1="${TOP + i * SP}" y2="${TOP + i * SP}" />`;
    g += `<line x1="8" x2="8" y1="${TOP}" y2="${BOT}" /><line x1="${W - 8}" x2="${W - 8}" y1="${TOP}" y2="${BOT}" />`;
    // clef glyph
    g += card.clef === "treble"
      ? `<text class="clef" x="14" y="${BOT - 3}" font-size="70">𝄞</text>`
      : `<text class="clef" x="16" y="${BOT + 2}" font-size="68">𝄢</text>`;
    // ledger lines
    const steps = card.tones.map(t => t.step);
    const mn = Math.min(...steps), mx = Math.max(...steps);
    for (let s = c.bottom - 2; s >= mn; s -= 2) g += `<line class="ledger" x1="${NX - 15}" x2="${NX + 15}" y1="${y(s)}" y2="${y(s)}" />`;
    for (let s = c.bottom + 10; s <= mx; s += 2) g += `<line class="ledger" x1="${NX - 15}" x2="${NX + 15}" y1="${y(s)}" y2="${y(s)}" />`;
    // accidentals, stacked into columns so they don't collide
    const sorted = [...card.tones].sort((a, b) => b.step - a.step);
    let col = 0, last = null;
    for (const t of sorted) {
      if (!t.acc) continue;
      col = last !== null && last - t.step < 6 ? col + 1 : 0; last = t.step;
      g += `<text class="acc" x="${NX - 22 - col * 13}" y="${y(t.step) + (t.acc > 0 ? 8 : 4)}" font-size="24" text-anchor="middle">${t.acc > 0 ? "♯" : "♭"}</text>`;
    }
    // whole-note heads
    const cls = state ? ` ${state}` : "";
    for (const t of card.tones) {
      const cy = y(t.step);
      g += `<g class="head${cls}" transform="translate(${NX} ${cy})"><ellipse rx="8.6" ry="5.8" /><ellipse class="hole" rx="4.2" ry="2.6" transform="rotate(-50)" /></g>`;
    }
    return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${card.clef} staff card">
      <style>line{stroke:var(--ink);stroke-width:1.2}.ledger{stroke-width:1.4}.clef,.acc{fill:var(--ink);font-family:var(--music)}
      .head ellipse{fill:var(--ink)}.head .hole{fill:var(--card)}.head.good ellipse:not(.hole){fill:var(--good)}.head.bad ellipse:not(.hole){fill:var(--bad)}</style>${g}</svg>`;
  }

  // ---------- sound ----------
  let ctx = null;
  function play(card) {
    if (!S.o.sound) return;
    try {
      ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
      const now = ctx.currentTime;
      card.tones.forEach(t => {
        const f = 440 * Math.pow(2, (midiOf(t.step, t.acc) - 69) / 12);
        for (const [type, mult, vol] of [["triangle", 1, 0.22], ["sine", 2, 0.06]]) {
          const o = ctx.createOscillator(), gn = ctx.createGain();
          o.type = type; o.frequency.value = f * mult;
          gn.gain.setValueAtTime(0, now); gn.gain.linearRampToValueAtTime(vol / card.tones.length * 1.6, now + 0.01);
          gn.gain.exponentialRampToValueAtTime(0.0001, now + 1.4);
          o.connect(gn).connect(ctx.destination); o.start(now); o.stop(now + 1.5);
        }
      });
    } catch {}
  }

  // ---------- game state ----------
  const S = { o: opts(), running: false, deck: [], card: null, prev: null, ans: {}, locked: false,
    right: 0, total: 0, streak: 0, bestStreak: 0, times: [], missed: {}, seen: {}, end: 0, cardStart: 0, timer: null };

  const configKey = o => `gss-best:${[o.treble && "T", o.bass && "B", o.notes && "N", o.chords && "C", o.inv && "I"].filter(Boolean).join("")}:${o.dur}:${o.lim}`;
  function showBest() {
    const b = store.get(configKey(S.o));
    $("best").textContent = b ? `Best for these settings: ${b}` : "Best: —";
  }

  function drawPad() {
    const chord = S.card && S.card.kind === "chord";
    const keys = $("keys");
    keys.innerHTML = LET.split("").map(l => `<button data-l="${l}" class="${S.ans.root === l ? "on" : ""}">${l}</button>`).join("");
    $("qualRow").hidden = !chord; $("goBtn").hidden = !chord;
    $("invRow").hidden = !(chord && S.o.inv);
    document.querySelectorAll("#qualRow button").forEach(b => b.classList.toggle("on", S.ans.qual === b.dataset.q));
    document.querySelectorAll("#invRow button").forEach(b => b.classList.toggle("on", S.ans.inv === +b.dataset.i));
    $("goBtn").disabled = !(S.ans.root && S.ans.qual && (!S.o.inv || S.ans.inv !== undefined));
    $("hint").textContent = chord ? "Pick the root, quality" + (S.o.inv ? ", and inversion" : "") + " — then submit (Enter)" : "Tap a letter or press A–G on your keyboard";
  }
  function render(state) {
    $("staff").innerHTML = staffSVG(S.card, state);
    if (!state) $("prompt").className = "prompt", $("prompt").textContent = S.card.kind === "chord" ? "Name the chord" : "Name the note";
    drawPad();
  }

  function nextCard() {
    let c; do { c = S.deck[Math.floor(Math.random() * S.deck.length)]; } while (S.deck.length > 1 && c === S.prev);
    S.prev = S.card = c; S.ans = {}; S.locked = false; S.cardStart = performance.now();
    render();
  }

  function hud() {
    const left = Math.max(0, S.end - performance.now()) / 1000;
    const secs = S.running ? Math.ceil(left) : S.o.dur;
    $("hTime").textContent = `${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, "0")}`;
    $("timeBar").style.transform = `scaleX(${S.running ? left / S.o.dur : 1})`;
    $("hScore").textContent = S.right;
    $("hAcc").textContent = S.total ? Math.round(100 * S.right / S.total) + "%" : "—";
    $("hStreak").textContent = S.streak;
    if (S.running && S.o.lim && !S.locked) {
      const used = (performance.now() - S.cardStart) / 1000;
      $("cardBar").style.transform = `scaleX(${Math.max(0, 1 - used / S.o.lim)})`;
      if (used >= S.o.lim) judge(false, true);
    } else if (!S.o.lim) $("cardBar").style.transform = "scaleX(0)";
    if (S.running && left <= 0 && !S.locked) finish();
  }

  function judge(ok, timedOut = false) {
    if (S.locked || !S.running) return;
    S.locked = true; S.total++;
    S.seen[S.card.label] = (S.seen[S.card.label] || 0) + 1;
    S.times.push((performance.now() - S.cardStart) / 1000);
    if (ok) { S.right++; S.streak++; S.bestStreak = Math.max(S.bestStreak, S.streak); }
    else { S.streak = 0; S.missed[S.card.label] = (S.missed[S.card.label] || 0) + 1; }
    render(ok ? "good" : "bad");
    const p = $("prompt");
    p.className = "prompt " + (ok ? "good" : "bad");
    p.textContent = ok ? `✓ ${S.card.label}` : `${timedOut ? "Time — " : "✗ "}it was ${S.card.label}`;
    play(S.card);
    hud();
    setTimeout(() => { if (!S.running) return; if (performance.now() >= S.end) finish(); else nextCard(); }, ok ? 450 : 1300);
  }

  function answerNote(l) {
    if (!S.running || S.locked || !S.card) return;
    if (S.card.kind === "note") return judge(l === S.card.letter);
    S.ans.root = l; drawPad();
  }
  function submitChord() {
    const c = S.card, a = S.ans;
    if (!S.running || S.locked || c.kind !== "chord" || $("goBtn").disabled) return;
    judge(a.root === c.root && a.qual === c.qual && (!S.o.inv || a.inv === c.inv));
  }

  function start() {
    S.o = opts();
    if (!S.o.treble && !S.o.bass) { $("prompt").textContent = "Pick at least one clef"; return; }
    if (!S.o.notes && !S.o.chords && !S.o.inv) { $("prompt").textContent = "Pick notes, chords or inversions"; return; }
    S.deck = buildDeck(S.o);
    Object.assign(S, { running: true, right: 0, total: 0, streak: 0, bestStreak: 0, times: [], missed: {}, seen: {}, end: performance.now() + S.o.dur * 1000 });
    $("overlay").hidden = true; $("results").hidden = true;
    document.querySelectorAll("#settings input").forEach(i => i.disabled = true);
    try { ctx = ctx || new (window.AudioContext || window.webkitAudioContext)(); ctx.resume(); } catch {}
    nextCard();
    clearInterval(S.timer); S.timer = setInterval(hud, 50); hud();
  }

  function finish() {
    if (!S.running) return;
    S.running = false; clearInterval(S.timer); hud();
    document.querySelectorAll("#settings input").forEach(i => i.disabled = false);
    syncInv();
    const avg = S.times.length ? (S.times.reduce((a, b) => a + b, 0) / S.times.length).toFixed(2) : "—";
    const key = configKey(S.o), prev = store.get(key) || 0, isBest = S.right > prev;
    if (isBest) store.set(key, S.right);
    if (S.total) {
      const hist = loadHist();
      hist.push({ t: Date.now(), cfg: key, label: cfgLabel(S.o), right: S.right, total: S.total,
        avg: S.times.reduce((a, b) => a + b, 0) / S.times.length, streak: S.bestStreak, seen: S.seen, missed: S.missed });
      store.set(HKEY, hist.slice(-1000));
    }
    const missed = Object.entries(S.missed).sort((a, b) => b[1] - a[1]);
    const r = $("results");
    r.innerHTML = `<h2>${isBest && S.right ? "New best!" : "Time’s up"}</h2>
      <div class="big">
        <div><b>${S.right}</b><small>Correct</small></div>
        <div><b>${S.total ? Math.round(100 * S.right / S.total) : 0}%</b><small>Accuracy</small></div>
        <div><b>${avg}${avg === "—" ? "" : "s"}</b><small>Avg per card</small></div>
        <div><b>${S.bestStreak}</b><small>Best streak</small></div>
      </div>
      ${missed.length ? `<div><div class="label" style="margin-bottom:6px">Practice these</div><div class="missed">${missed.map(([k, n]) => `<span>${k}${n > 1 ? " ×" + n : ""}</span>`).join("")}</div></div>` : `<div class="label">No misses — try a shorter per-card limit.</div>`}`;
    r.hidden = false;
    $("overlay").hidden = false; $("startBtn").textContent = "Go again";
    showBest(); drawHistory();
  }

  // ---------- history ----------
  const HKEY = "gss-history";
  const HV = { scope: "cfg", metric: "right" };
  function loadHist() { const h = store.get(HKEY); return Array.isArray(h) ? h : []; }
  function cfgLabel(o) {
    const clefs = o.treble && o.bass ? "Both clefs" : o.treble ? "Treble" : "Bass";
    const kinds = [o.notes && "Notes", o.chords && "Chords", o.inv && "Inversions"].filter(Boolean).join(" + ");
    const dur = o.dur >= 60 ? `${o.dur / 60} min` : `${o.dur} s`;
    return `${clefs} · ${kinds} · ${dur}${o.lim ? ` · ${o.lim}s/card` : ""}`;
  }
  const fmtDate = t => new Date(t).toLocaleDateString(undefined, { month: "short", day: "numeric" });
  const fmtFull = t => new Date(t).toLocaleString(undefined, { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
  const METRIC = {
    right: { get: r => r.right, fmt: v => String(Math.round(v)), name: "correct" },
    acc:   { get: r => 100 * r.right / r.total, fmt: v => Math.round(v) + "%", name: "accuracy", max: 100 },
    avg:   { get: r => r.avg, fmt: v => v.toFixed(1) + "s", name: "sec per card" },
  };
  function niceMax(v) {
    // top of axis = 4 ticks of a 1/2/5-style step, so every label is a round number
    const raw = Math.max(v, 0.4) / 4, p = Math.pow(10, Math.floor(Math.log10(raw))), n = raw / p;
    return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 && p < 1 ? 2.5 : n <= 5 ? 5 : 10) * p * 4;
  }

  function drawChart(rows) {
    const el = $("chart");
    if (!rows.length) { el.innerHTML = `<div class="empty">Finish a session and your scores will start charting here.</div>`; return; }
    const m = METRIC[HV.metric], pts = rows.slice(-30);
    const Wc = Math.max(280, el.clientWidth || 560), Hc = 180, L = 34, R = 34, T = 14, B = 24;
    const vals = pts.map(m.get), top = m.max || niceMax(Math.max(...vals) * 1.1);
    const xs = i => pts.length === 1 ? L + (Wc - L - R) / 2 : L + i * (Wc - L - R) / (pts.length - 1);
    const ys = v => T + (1 - v / top) * (Hc - T - B);
    let g = "";
    for (let k = 0; k <= 4; k++) {
      const v = top * k / 4, y = ys(v);
      g += `<line class="grid" x1="${L}" x2="${Wc - R}" y1="${y}" y2="${y}"/><text class="axis" x="${L - 6}" y="${y + 3.5}" text-anchor="end">${m.fmt(v)}</text>`;
    }
    g += `<text class="axis" x="${xs(0)}" y="${Hc - 6}" text-anchor="${pts.length === 1 ? "middle" : "start"}">${fmtDate(pts[0].t)}</text>`;
    if (pts.length > 1) g += `<text class="axis" x="${xs(pts.length - 1)}" y="${Hc - 6}" text-anchor="end">${fmtDate(pts[pts.length - 1].t)}</text>`;
    const line = vals.map((v, i) => `${i ? "L" : "M"}${xs(i).toFixed(1)} ${ys(v).toFixed(1)}`).join("");
    if (pts.length > 1) g += `<path class="ar" d="${line}L${xs(pts.length - 1)} ${ys(0)}L${xs(0)} ${ys(0)}Z"/><path class="ln" d="${line}"/>`;
    if (pts.length <= 40) vals.forEach((v, i) => g += `<circle class="dot" cx="${xs(i)}" cy="${ys(v)}" r="${i === vals.length - 1 ? 5 : 3.5}"/>`);
    const lv = vals[vals.length - 1];
    g += `<text class="end" x="${xs(vals.length - 1) + 8}" y="${ys(lv) + 4}">${m.fmt(lv)}</text>`;
    g += `<line class="xh" id="xh" x1="0" x2="0" y1="${T}" y2="${Hc - B}" visibility="hidden"/>`;
    g += `<rect class="hit" id="hit" x="${L - 10}" y="0" width="${Wc - L - R + 20}" height="${Hc}"/>`;
    el.innerHTML = `<svg viewBox="0 0 ${Wc} ${Hc}" role="img" aria-label="${m.name} over your last ${pts.length} sessions">${g}</svg><div class="tip" id="tip" hidden></div>`;
    const svg = el.querySelector("svg"), tip = $("tip"), xh = $("xh");
    const move = e => {
      const r = svg.getBoundingClientRect(), x = (e.clientX - r.left) * Wc / r.width;
      let i = pts.length === 1 ? 0 : Math.round((x - L) / ((Wc - L - R) / (pts.length - 1)));
      i = Math.max(0, Math.min(pts.length - 1, i));
      const p = pts[i], sx = xs(i) * r.width / Wc, sy = ys(vals[i]) * r.height / Hc;
      xh.setAttribute("x1", xs(i)); xh.setAttribute("x2", xs(i)); xh.setAttribute("visibility", "visible");
      tip.innerHTML = `${fmtFull(p.t)}<br><b>${p.right}/${p.total}</b> correct · <b>${Math.round(100 * p.right / p.total)}%</b> · <b>${p.avg.toFixed(1)}s</b>/card`;
      tip.hidden = false;
      tip.style.left = Math.min(Math.max(sx, 90), r.width - 90) + "px"; tip.style.top = sy + "px";
    };
    const leave = () => { tip.hidden = true; xh.setAttribute("visibility", "hidden"); };
    $("hit").addEventListener("pointermove", move);
    $("hit").addEventListener("pointerdown", move);
    $("hit").addEventListener("pointerleave", leave);
  }

  function drawHistory() {
    const all = loadHist();
    const key = configKey(S.o);
    const rows = HV.scope === "cfg" ? all.filter(r => r.cfg === key) : all;
    // summary
    const cards = rows.reduce((a, r) => a + r.total, 0), right = rows.reduce((a, r) => a + r.right, 0);
    const best = rows.length ? Math.max(...rows.map(r => r.right)) : 0;
    $("hSum").innerHTML = `
      <div><b>${rows.length}</b><small>Sessions</small></div>
      <div><b>${cards}</b><small>Cards seen</small></div>
      <div><b>${cards ? Math.round(100 * right / cards) + "%" : "—"}</b><small>Overall accuracy</small></div>
      <div><b>${rows.length ? best : "—"}</b><small>Best score</small></div>`;
    drawChart(rows);
    // most missed (misses + miss rate)
    const seen = {}, miss = {};
    rows.forEach(r => {
      for (const [k, n] of Object.entries(r.seen || {})) seen[k] = (seen[k] || 0) + n;
      for (const [k, n] of Object.entries(r.missed || {})) miss[k] = (miss[k] || 0) + n;
    });
    const top = Object.entries(miss).sort((a, b) => b[1] - a[1] || (b[1] / (seen[b[0]] || 1)) - (a[1] / (seen[a[0]] || 1))).slice(0, 12);
    $("hMissed").innerHTML = top.length
      ? top.map(([k, n]) => `<span title="Missed ${n} of ${seen[k] || n} times">${k} <small>${n}/${seen[k] || n}</small></span>`).join("")
      : `<div class="hint" style="text-align:left">${rows.length ? "No misses yet." : "Notes you miss will collect here."}</div>`;
    // recent table
    const recent = rows.slice(-10).reverse();
    $("hTable").innerHTML = recent.length
      ? `<thead><tr><th>When</th>${HV.scope === "all" ? "<th>Settings</th>" : ""}<th class="num">Correct</th><th class="num">Acc.</th><th class="num">Sec/card</th></tr></thead><tbody>${
        recent.map(r => `<tr><td>${fmtFull(r.t)}</td>${HV.scope === "all" ? `<td>${r.label}</td>` : ""}<td class="num">${r.right}/${r.total}</td><td class="num">${Math.round(100 * r.right / r.total)}%</td><td class="num">${r.avg.toFixed(1)}</td></tr>`).join("")}</tbody>`
      : `<tbody><tr><td class="hint" style="text-align:left;border:0">${HV.scope === "cfg" && all.length ? "No sessions with these settings yet. Switch to All sessions to see the rest." : "No sessions yet."}</td></tr></tbody>`;
    $("clearBtn").hidden = !all.length;
  }

  const seg = (id, k) => $(id).addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    HV[k] = b.dataset.v; $(id).querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b));
    try { localStorage.setItem("gss-view", JSON.stringify(HV)); } catch {}
    drawHistory();
  });
  seg("scopeSeg", "scope"); seg("metricSeg", "metric");
  try { const v = JSON.parse(localStorage.getItem("gss-view")); if (v) { if (METRIC[v.metric]) HV.metric = v.metric; if (v.scope === "all") HV.scope = "all"; } } catch {}
  document.querySelectorAll("#scopeSeg button").forEach(b => b.classList.toggle("on", b.dataset.v === HV.scope));
  document.querySelectorAll("#metricSeg button").forEach(b => b.classList.toggle("on", b.dataset.v === HV.metric));
  $("clearBtn").addEventListener("click", () => { $("clearAsk").hidden = false; $("clearBtn").hidden = true; });
  $("clearNo").addEventListener("click", () => { $("clearAsk").hidden = true; $("clearBtn").hidden = false; });
  $("clearYes").addEventListener("click", () => {
    try { Object.keys(localStorage).filter(k => k.startsWith("gss-")).forEach(k => localStorage.removeItem(k)); } catch {}
    $("clearAsk").hidden = true; showBest(); drawHistory();
  });
  let rz; window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(drawHistory, 120); });

  // ---------- wiring ----------
  function syncInv() {
    // Inversions require chords to be meaningful; keep the deck non-empty.
    if (S.running) return;
    S.o = opts(); showBest(); hud(); drawHistory();
  }
  document.querySelectorAll("#settings input").forEach(i => i.addEventListener("change", syncInv));
  $("startBtn").addEventListener("click", start);
  $("keys").addEventListener("click", e => { const b = e.target.closest("button"); if (b) answerNote(b.dataset.l); });
  $("qualRow").addEventListener("click", e => { const b = e.target.closest("button"); if (b && S.running && !S.locked) { S.ans.qual = b.dataset.q; drawPad(); } });
  $("invRow").addEventListener("click", e => { const b = e.target.closest("button"); if (b && S.running && !S.locked) { S.ans.inv = +b.dataset.i; drawPad(); } });
  $("goBtn").addEventListener("click", submitChord);
  document.addEventListener("keydown", e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const k = e.key.toUpperCase();
    if (!S.running && (e.key === "Enter" || e.key === " ") && document.activeElement === document.body) { e.preventDefault(); return start(); }
    if (!S.running) return;
    if (LET.includes(k) && k.length === 1) { e.preventDefault(); answerNote(k); }
    else if (S.card?.kind === "chord") {
      if (e.key === "M" || k === "J") { S.ans.qual = "maj"; drawPad(); }
      else if (e.key === "m" || k === "N") { S.ans.qual = "min"; drawPad(); }
      else if (["0", "1", "2"].includes(e.key) && S.o.inv) { S.ans.inv = +e.key; drawPad(); }
      else if (e.key === "Enter") { e.preventDefault(); submitChord(); }
    }
  });

  // Resting state: a sample card so the page shows what it does.
  S.card = { kind: "note", clef: "treble", tones: [{ step: 32, acc: 0 }], letter: "G", label: "G4" };
  render(); showBest(); hud(); drawHistory();
})();
</script>

</body>
</html>
